<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>meikipop Mining Bridge - Options</title>
  <style>
    body { font-family: sans-serif; padding: 16px; width: 320px; }
    h3 { margin-top: 0; }
    label { display: block; margin-top: 10px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px; }
    button { margin-top: 12px; padding: 6px 12px; margin-right: 6px; }
    #status { margin-top: 10px; font-size: 12px; }
    .hint { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h3>meikipop Mining Bridge</h3>
  <p class="hint">
    In meikipop: Settings &rarr; Mining Bridge &rarr; enable it, then click
    "Copy Pairing Token" and paste it below.
  </p>
  <label>Pairing JSON (paste here to auto-fill port/token below)
    <input id="pairing" placeholder='{"port":8850,"token":"..."}'>
  </label>
  <label>Port
    <input id="port" type="number" value="8850">
  </label>
  <label>Token
    <input id="token">
  </label>
  <button id="save">Save</button>
  <button id="test">Test Connection</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
